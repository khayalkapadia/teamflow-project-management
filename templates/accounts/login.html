{% extends "base.html" %}

{% block title %}
    Login | TeamFlow
{% endblock %}

{% block content %}

<style>

    .auth-page {
        max-width: 470px;
        margin: 45px auto;
    }

    .auth-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 34px;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-logo {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        border-radius: 12px;
        background: #111827;
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
    }

    .auth-header h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 700;
        color: #111827;
        letter-spacing: -0.4px;
    }

    .auth-header p {
        margin-top: 8px;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
    }

    .error-message {
        margin-bottom: 20px;
        padding: 13px 15px;
        border: 1px solid #fecaca;
        border-radius: 8px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 13px;
        font-weight: 600;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        margin-bottom: 7px;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        height: 45px;
        padding: 0 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        color: #111827;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease,
                    box-shadow 0.15s ease;
    }

    .form-group input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .form-group input::placeholder {
        color: #94a3b8;
    }

    .login-button {
        width: 100%;
        height: 45px;
        margin-top: 4px;
        border: 1px solid #2563eb;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .login-button:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
        transform: translateY(-1px);
    }

    .auth-footer {
        margin-top: 24px;
        padding-top: 22px;
        border-top: 1px solid #eef2f7;
        text-align: center;
        color: #64748b;
        font-size: 13px;
    }

    .auth-footer a {
        color: #2563eb;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {

        .auth-page {
            margin: 25px auto;
        }

        .auth-card {
            padding: 25px 20px;
        }

    }

</style>


<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">
                TF
            </div>

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to continue to your TeamFlow workspace.
            </p>

        </div>


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST" class="auth-form">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>

        </form>


        <div class="auth-footer">

            Don't have a TeamFlow account?

            <a href="{% url 'register' %}">
                Create an account
            </a>

        </div>

    </div>

</div>

{% endblock %}
